<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Form</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">

</head>
<body>
    <div class="container" style="margin-top:2em">
        <!-- Encabezado de la página -->
         <h1>Formulario de Películas</h1>
         <p class="tagline">Hola</p>
         <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %} 
            <!-- Formulario de nueva tarea -->
            <div class="form-group">
                <label for="title">Titulo de la película</label>
                <input type="text" id="title" class="form-control" placeholder="Escribe el título" name="title" required>
            </div>
            <div class="form-group">
                <label for="description">Descripción</label>
                <textarea id="description" class="form-control" placeholder="Describe la película" name="description" required></textarea>
            </div>
            <div class="form-group">
                <label for="release-date">Fecha de Lanzamiento</label>
                <input type="date" id="release-date" class="form-control" name="release-date" required>
            </div>
            <div class="form-group">
                <label for="poster">Imagen de la película</label>
                <input type="file" id="poster" class="form-control" name="poster" accept="image/*" required>
            </div>
            <!-- Fin formulario Movie -->
            <!-- Botones para agregar o eliminar movie -->
            <div class="row">
                <button class="btn btn-primary" name="movieAdd" type="submit"><i class="fa fa-plus icon"></i>Agregar Película</button>
                <button disabled class="btn btn-danger" name="taskDelete" formnovalidate="" type="submit" onclick="$('input#sublist').click();"><i class="fa fa-trash-o icon"></i>Eliminar Película</button>
            </div>
            <!-- Fin botones para agregar o eliminar películas -->
            <!-- Lista de las películas existentes -->
            <ul class="list-group">
                {% for movie in movies %}
                    <li class="list-group-item">
                        <div class="card" style="width: 18rem;">
                            <!-- Imagen de la película -->
                            <img src="{{ movie.poster.url }}" class="card-img-top" alt="Poster de {{ movie.title }}">
                            <div class="card-body">
                                <!-- Título de la película -->
                                <h5 class="card-title">{{ movie.title }}</h5>
                                <!-- Descripción corta -->
                                <p class="card-text">{{ movie.description|truncatewords:20 }}</p>
                                <!-- Fecha de lanzamiento -->
                                <p class="card-text"><small class="text-muted">Lanzamiento: {{ movie.release_date }}</small></p>
                                <!-- Checkbox para seleccionar la película -->
                                <input type="checkbox" class="taskCheckbox" name="checkedbox" id="{{ movie.id }}" value="{{ movie.id }}">
                            </div>
                        </div>
                    </li>
                {% endfor %}
            </ul>
         </form>

    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

</body>
</html>
